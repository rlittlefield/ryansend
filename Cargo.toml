[package]
name = "ryansend"
version = "1.11.1"
edition = "2021"
license = "MIT OR Apache-2.0"

[dependencies]
axum = "0.8"
tokio = { version = "1.49", features = ["macros", "rt-multi-thread", "fs", "net", "io-util", "signal"] }
rusty_paseto = { version = "0.10", features = ["paserk"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-saphyr = "2.1"
clap = { version = "4.5", features = ["derive"] }
jiff = { version = "1", features = ["serde"] }
anyhow = "1.0"
rand = "0.10"
log = "0.4"
env_logger = "0.11"
tokio-util = { version = "0.7", features = ["io"] }
# No "config" feature: it only reads askama.toml and pulls in the unmaintained basic-toml
askama = { version = "0.16", default-features = false, features = ["derive", "std", "urlencode"] }
argon2 = "0.6"
rpassword = "7.4"
axum-extra = { version = "0.12", features = ["cookie"] }
time = "0.3"
fast-glob = "1.0"
walkdir = "2.5"
urlencoding = "2.1"
governor = "0.10"
timedmap = "1.0"
hex = "0.4"
url = "2.5"
futures = "0.3"
async-stream = "0.3"
bytes = "1.11"
reqwest = { version = "0.13", features = ["json", "stream", "query"] }
# TLS and certificate management dependencies
rustls = "0.23"
rustls-pki-types = { version = "1.13", features = ["std"] }
axum-server = { version = "0.9", features = ["tls-rustls"] }
instant-acme = { version = "0.8", features = ["hyper-rustls"] }
rcgen = "0.14.6"
base64 = "0.23"
async_zip = { version = "0.0.19", default-features = false, features = ["tokio"] }

[dev-dependencies]
tempfile = "3.8"
serial_test = "3.0"
