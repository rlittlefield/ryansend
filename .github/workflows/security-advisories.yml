# Opens security PRs. Triage (cargo audit + Claude) runs in a private
# repository, which dispatches this workflow with a JSON payload. Only the
# PRs are public. See .github/security-bot/README.md.
name: Security advisories

on:
  workflow_dispatch:
    inputs:
      payload:
        description: "Triage payload (JSON), sent by the private triage repo"
        required: true
        type: string

permissions: {}

concurrency:
  group: security-advisories
  cancel-in-progress: false

jobs:
  act:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write # labels
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install cargo-audit
        run: cargo install --locked cargo-audit

      # The payload goes through an env var, never into the script text,
      # and bot.py validates it against a fresh cargo audit.
      - name: Open PRs
        env:
          GH_TOKEN: ${{ github.token }}
          SECURITY_BOT_PAYLOAD: ${{ inputs.payload }}
        run: |
          gh auth setup-git
          python3 .github/security-bot/bot.py
