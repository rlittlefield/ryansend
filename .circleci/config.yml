version: 2.1

# Import orbs
orbs:
  rust: circleci/rust@1.8.0

# Define custom commands for reusability
commands:
  restore_cargo_cache:
    description: "Restore Cargo cache"
    steps:
      - restore_cache:
          keys:
            - cargo-cache-v2-{{ arch }}-{{ checksum "Cargo.lock" }}
            - cargo-cache-v2-{{ arch }}-

  save_cargo_cache:
    description: "Save Cargo cache"
    steps:
      - save_cache:
          key: cargo-cache-v2-{{ arch }}-{{ checksum "Cargo.lock" }}
          paths:
            - ~/.cargo/registry
            - ~/.cargo/git
            - target

  extract_version:
    description: "Extract version from Cargo.toml"
    steps:
      - run:
          name: Extract version from Cargo.toml
          command: |
            VERSION=$(grep -E '^version = ' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
            echo "export CARGO_VERSION=$VERSION" >> $BASH_ENV
            echo "Extracted version: $VERSION"

  restore_audit_tools_cache:
    description: "Restore security audit tools cache"
    steps:
      - restore_cache:
          keys:
            - audit-tools-v1-{{ arch }}
            - audit-tools-v1-

  save_audit_tools_cache:
    description: "Save security audit tools cache"
    steps:
      - save_cache:
          key: audit-tools-v1-{{ arch }}
          paths:
            - ~/.cargo/bin/cargo-audit
            - ~/.cargo/bin/cargo-deny

  restore_audit_db_cache:
    description: "Restore cargo-audit vulnerability database cache"
    steps:
      - restore_cache:
          keys:
            - audit-db-v1-{{ epoch }}
            - audit-db-v1-

  save_audit_db_cache:
    description: "Save cargo-audit vulnerability database cache"
    steps:
      - save_cache:
          key: audit-db-v1-{{ epoch }}
          paths:
            - ~/.cargo/advisory-db

  install_audit_tools:
    description: "Install security audit tools with caching"
    steps:
      - restore_audit_tools_cache
      - run:
          name: Install cargo-audit and cargo-deny
          command: |
            if ! command -v cargo-audit &> /dev/null; then
              echo "Installing cargo-audit..."
              cargo install cargo-audit
            else
              echo "cargo-audit already installed (from cache)"
            fi
            if ! command -v cargo-deny &> /dev/null; then
              echo "Installing cargo-deny..."
              cargo install --locked cargo-deny
            else
              echo "cargo-deny already installed (from cache)"
            fi
      - save_audit_tools_cache

# Define jobs
jobs:
  test:
    executor:
      name: rust/default
      tag: "1.92.0"
    environment:
      CARGO_TERM_COLOR: always
    steps:
      - checkout
      - rust/install
      - run:
          name: Install Rust components
          command: |
            rustup component add clippy rustfmt
      - restore_cargo_cache
      - run:
          name: Check formatting
          command: cargo fmt --all -- --check

      - run:
          name: Run clippy
          command: cargo clippy --all-targets --all-features -- -D warnings

      - run:
          name: Check for unsafe code (clippy)
          command: |
            cargo clippy --all-targets --all-features -- \
              -D clippy::undocumented_unsafe_blocks \
              -D clippy::multiple_unsafe_ops_per_block

      - run:
          name: Run tests
          command: cargo test --verbose

      - run:
          name: Build release
          command: cargo build --release --verbose

      - save_cargo_cache

  docker-build-test:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - setup_remote_docker:
          docker_layer_caching: true
      - extract_version

      - run:
          name: Build Docker image (test only)
          command: |
            docker build -t ryansend:${CARGO_VERSION} .
            echo "Successfully built Docker image ryansend:${CARGO_VERSION}"

  security-audit:
    executor:
      name: rust/default
      tag: "1.92.0"
    steps:
      - checkout
      - rust/install
      - install_audit_tools
      - restore_audit_db_cache

      - run:
          name: Run security audit
          command: |
            echo "Running cargo audit..."
            cargo audit

      - run:
          name: Run cargo deny
          command: |
            echo "Running cargo deny..."
            cargo deny check

      - save_audit_db_cache

  build-amd64-docker:
    docker:
      - image: cimg/base:current
    resource_class: large
    steps:
      - checkout
      - setup_remote_docker:
          docker_layer_caching: true
      - extract_version

      - run:
          name: Extract tag version (if triggered by tag)
          command: |
            if [[ "$CIRCLE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              TAG_VERSION=${CIRCLE_TAG#v}
              echo "export TAG_VERSION=$TAG_VERSION" >> $BASH_ENV
              echo "Tag version: $TAG_VERSION"
            fi

      - run:
          name: Verify version consistency
          command: |
            if [ ! -z "$TAG_VERSION" ]; then
              if [ "$CARGO_VERSION" != "$TAG_VERSION" ]; then
                echo "ERROR: Cargo.toml version ($CARGO_VERSION) does not match tag version ($TAG_VERSION)"
                exit 1
              fi
              echo "✅ Version consistency verified: $CARGO_VERSION"
            fi

      - run:
          name: Login to Docker Hub
          command: |
            echo $DOCKER_TOKEN | docker login -u $DOCKER_USERNAME --password-stdin

      - run:
          name: Build and push AMD64 Docker image
          command: |
            # Always tag with Cargo.toml version
            TAG_NAME="$DOCKER_USERNAME/ryansend:$CARGO_VERSION-amd64"

            # Build AMD64 image
            docker build \
              --tag $TAG_NAME \
              --label "org.opencontainers.image.title=ryansend" \
              --label "org.opencontainers.image.description=A secure file sharing tool using PASETO tokens" \
              --label "org.opencontainers.image.version=$CARGO_VERSION" \
              --label "org.opencontainers.image.vendor=ryansend" \
              --label "org.opencontainers.image.source=https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME" \
              --label "org.opencontainers.image.revision=$CIRCLE_SHA1" \
              --label "org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              .

            # Push AMD64 image
            docker push $TAG_NAME

            # Tag and push additional tags
            if [ "$CIRCLE_BRANCH" = "main" ] || [ -n "$CIRCLE_TAG" ]; then
              docker tag $TAG_NAME $DOCKER_USERNAME/ryansend:latest-amd64
              docker push $DOCKER_USERNAME/ryansend:latest-amd64
            fi

            if [ ! -z "$CIRCLE_TAG" ]; then
              TAG_WITHOUT_V=${CIRCLE_TAG#v}
              docker tag $TAG_NAME $DOCKER_USERNAME/ryansend:$TAG_WITHOUT_V-amd64
              docker push $DOCKER_USERNAME/ryansend:$TAG_WITHOUT_V-amd64
            fi

            if [ -z "$CIRCLE_TAG" ] && [ ! -z "$CIRCLE_BRANCH" ]; then
              SAFE_BRANCH=$(echo "$CIRCLE_BRANCH" | sed 's/\//-/g')
              docker tag $TAG_NAME $DOCKER_USERNAME/ryansend:$SAFE_BRANCH-amd64
              docker push $DOCKER_USERNAME/ryansend:$SAFE_BRANCH-amd64
            fi

      - run:
          name: Generate AMD64 summary
          command: |
            echo "## 🚀 AMD64 Docker Image Published Successfully"
            echo ""
            echo "**Version:** $CARGO_VERSION"
            echo "**Git SHA:** $CIRCLE_SHA1"
            echo "**Platform:** linux/amd64"
            echo "**Runner:** x86_64 (large)"

  build-arm64-docker:
    machine:
      image: ubuntu-2404:current
    resource_class: arm.large
    steps:
      - checkout
      - extract_version

      - run:
          name: Extract tag version (if triggered by tag)
          command: |
            if [[ "$CIRCLE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              TAG_VERSION=${CIRCLE_TAG#v}
              echo "export TAG_VERSION=$TAG_VERSION" >> $BASH_ENV
              echo "Tag version: $TAG_VERSION"
            fi

      - run:
          name: Verify version consistency
          command: |
            if [ ! -z "$TAG_VERSION" ]; then
              if [ "$CARGO_VERSION" != "$TAG_VERSION" ]; then
                echo "ERROR: Cargo.toml version ($CARGO_VERSION) does not match tag version ($TAG_VERSION)"
                exit 1
              fi
              echo "✅ Version consistency verified: $CARGO_VERSION"
            fi

      - run:
          name: Login to Docker Hub
          command: |
            echo $DOCKER_TOKEN | docker login -u $DOCKER_USERNAME --password-stdin

      - run:
          name: Build and push ARM64 Docker image
          command: |
            # Always tag with Cargo.toml version
            TAG_NAME="$DOCKER_USERNAME/ryansend:$CARGO_VERSION-arm64"

            # Build ARM64 image (native build on ARM64 machine)
            docker build \
              --tag $TAG_NAME \
              --label "org.opencontainers.image.title=ryansend" \
              --label "org.opencontainers.image.description=A secure file sharing tool using PASETO tokens" \
              --label "org.opencontainers.image.version=$CARGO_VERSION" \
              --label "org.opencontainers.image.vendor=ryansend" \
              --label "org.opencontainers.image.source=https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME" \
              --label "org.opencontainers.image.revision=$CIRCLE_SHA1" \
              --label "org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              .

            # Push ARM64 image
            docker push $TAG_NAME

            # Tag and push additional tags
            if [ "$CIRCLE_BRANCH" = "main" ] || [ -n "$CIRCLE_TAG" ]; then
              docker tag $TAG_NAME $DOCKER_USERNAME/ryansend:latest-arm64
              docker push $DOCKER_USERNAME/ryansend:latest-arm64
            fi

            if [ ! -z "$CIRCLE_TAG" ]; then
              TAG_WITHOUT_V=${CIRCLE_TAG#v}
              docker tag $TAG_NAME $DOCKER_USERNAME/ryansend:$TAG_WITHOUT_V-arm64
              docker push $DOCKER_USERNAME/ryansend:$TAG_WITHOUT_V-arm64
            fi

            if [ -z "$CIRCLE_TAG" ] && [ ! -z "$CIRCLE_BRANCH" ]; then
              SAFE_BRANCH=$(echo "$CIRCLE_BRANCH" | sed 's/\//-/g')
              docker tag $TAG_NAME $DOCKER_USERNAME/ryansend:$SAFE_BRANCH-arm64
              docker push $DOCKER_USERNAME/ryansend:$SAFE_BRANCH-arm64
            fi

      - run:
          name: Generate ARM64 summary
          command: |
            echo "## 🚀 ARM64 Docker Image Published Successfully"
            echo ""
            echo "**Version:** $CARGO_VERSION"
            echo "**Git SHA:** $CIRCLE_SHA1"
            echo "**Platform:** linux/arm64"
            echo "**Runner:** arm64 (large)"

  # Publishing only happens for tags on commits already merged to main whose
  # Cargo.toml version matches the tag. Runs without the docker-hub-creds context.
  verify-release-tag:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - checkout
      - run:
          name: Check the tag is on main and matches Cargo.toml
          command: |
            set -eu
            git fetch --no-tags origin main
            if ! git merge-base --is-ancestor "$CIRCLE_SHA1" FETCH_HEAD; then
              echo "Refusing to publish: $CIRCLE_TAG ($CIRCLE_SHA1) is not on main."
              exit 1
            fi
            VERSION=$(sed -n 's/^version = "\([0-9.]*\)"$/\1/p' Cargo.toml | head -n 1)
            if [ "v$VERSION" != "$CIRCLE_TAG" ]; then
              echo "Refusing to publish: tag $CIRCLE_TAG does not match Cargo.toml version $VERSION."
              exit 1
            fi
            echo "$CIRCLE_TAG is on main and matches Cargo.toml."

  create-multiarch-manifest:
    docker:
      - image: cimg/base:current
    resource_class: medium
    steps:
      - checkout
      - extract_version

      - run:
          name: Extract tag version (if triggered by tag)
          command: |
            if [[ "$CIRCLE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              TAG_VERSION=${CIRCLE_TAG#v}
              echo "export TAG_VERSION=$TAG_VERSION" >> $BASH_ENV
              echo "Tag version: $TAG_VERSION"
            fi

      - run:
          name: Login to Docker Hub
          command: |
            echo $DOCKER_TOKEN | docker login -u $DOCKER_USERNAME --password-stdin

      - run:
          name: Create and push multi-arch manifest
          command: |
            # Enable experimental CLI features for manifest commands
            export DOCKER_CLI_EXPERIMENTAL=enabled

            # Always create manifest for Cargo.toml version
            docker manifest create --amend $DOCKER_USERNAME/ryansend:$CARGO_VERSION \
              $DOCKER_USERNAME/ryansend:$CARGO_VERSION-amd64 \
              $DOCKER_USERNAME/ryansend:$CARGO_VERSION-arm64
            docker manifest push $DOCKER_USERNAME/ryansend:$CARGO_VERSION

            # Create latest manifest if on main branch
            if [ "$CIRCLE_BRANCH" = "main" ] || [ -n "$CIRCLE_TAG" ]; then
              docker manifest create --amend $DOCKER_USERNAME/ryansend:latest \
                $DOCKER_USERNAME/ryansend:latest-amd64 \
                $DOCKER_USERNAME/ryansend:latest-arm64
              docker manifest push $DOCKER_USERNAME/ryansend:latest
            fi

            # Create tag manifest if triggered by tag
            if [ ! -z "$CIRCLE_TAG" ]; then
              TAG_WITHOUT_V=${CIRCLE_TAG#v}
              docker manifest create --amend $DOCKER_USERNAME/ryansend:$TAG_WITHOUT_V \
                $DOCKER_USERNAME/ryansend:$TAG_WITHOUT_V-amd64 \
                $DOCKER_USERNAME/ryansend:$TAG_WITHOUT_V-arm64
              docker manifest push $DOCKER_USERNAME/ryansend:$TAG_WITHOUT_V
            fi

            # Create branch manifest for non-tag pushes (sanitized)
            if [ -z "$CIRCLE_TAG" ] && [ ! -z "$CIRCLE_BRANCH" ]; then
              SAFE_BRANCH=$(echo "$CIRCLE_BRANCH" | sed 's/\//-/g')
              docker manifest create --amend $DOCKER_USERNAME/ryansend:$SAFE_BRANCH \
                $DOCKER_USERNAME/ryansend:$SAFE_BRANCH-amd64 \
                $DOCKER_USERNAME/ryansend:$SAFE_BRANCH-arm64
              docker manifest push $DOCKER_USERNAME/ryansend:$SAFE_BRANCH
            fi

      - run:
          name: Generate final summary
          command: |
            echo "## 🚀 Multi-Architecture Docker Images Published Successfully"
            echo ""
            echo "**Version:** $CARGO_VERSION"
            echo "**Git SHA:** $CIRCLE_SHA1"
            echo "**Platforms:** linux/amd64, linux/arm64"
            echo ""
            echo "**Published Images:**"
            echo "- $DOCKER_USERNAME/ryansend:$CARGO_VERSION (multi-arch)"
            if [ "$CIRCLE_BRANCH" = "main" ] || [ -n "$CIRCLE_TAG" ]; then
              echo "- $DOCKER_USERNAME/ryansend:latest (multi-arch)"
            fi
            if [ ! -z "$CIRCLE_TAG" ]; then
              TAG_WITHOUT_V=${CIRCLE_TAG#v}
              echo "- $DOCKER_USERNAME/ryansend:$TAG_WITHOUT_V (multi-arch)"
            fi
            if [ -z "$CIRCLE_TAG" ] && [ ! -z "$CIRCLE_BRANCH" ]; then
              SAFE_BRANCH=$(echo "$CIRCLE_BRANCH" | sed 's/\//-/g')
              echo "- $DOCKER_USERNAME/ryansend:$SAFE_BRANCH (multi-arch)"
            fi
            echo ""
            echo "**Pull Commands:**"
            echo '```bash'
            echo "docker pull $DOCKER_USERNAME/ryansend:$CARGO_VERSION"
            if [ "$CIRCLE_BRANCH" = "main" ] || [ -n "$CIRCLE_TAG" ]; then
              echo "docker pull $DOCKER_USERNAME/ryansend:latest"
            fi
            echo '```'

# Define workflows
workflows:
  version: 2

  # Main CI workflow (runs on PRs and pushes to main/develop)
  ci:
    jobs:
      - test:
          filters:
            branches:
              only:
                - main
                - develop
                - /^feature\/.*/
                - /^hotfix\/.*/
            tags:
              ignore: /.*/

      - docker-build-test:
          requires:
            - test
          filters:
            branches:
              only:
                - main
                - develop
            tags:
              ignore: /.*/

      - security-audit:
          filters:
            branches:
              only:
                - main
                - develop
            tags:
              ignore: /.*/

  # Docker publish workflow (runs on version tags)
  docker-publish:
    jobs:
      - verify-release-tag:
          filters:
            branches:
              ignore: /.*/
            tags:
              only: /^v\d+\.\d+\.\d+$/

      - build-amd64-docker:
          context:
            - docker-hub-creds
          requires:
            - verify-release-tag
          filters:
            branches:
              ignore: /.*/
            tags:
              only: /^v\d+\.\d+\.\d+$/

      - build-arm64-docker:
          context:
            - docker-hub-creds
          requires:
            - verify-release-tag
          filters:
            branches:
              ignore: /.*/
            tags:
              only: /^v\d+\.\d+\.\d+$/

      - create-multiarch-manifest:
          context:
            - docker-hub-creds
          requires:
            - build-amd64-docker
            - build-arm64-docker
          filters:
            branches:
              ignore: /.*/
            tags:
              only: /^v\d+\.\d+\.\d+$/

  # Manual workflow for development branches (comparison build)
  manual-build:
    jobs:
      - hold-for-approval:
          type: approval
          filters:
            branches:
              only:
                - main
                - develop

      - build-amd64-docker:
          context:
            - docker-hub-creds
          requires:
            - hold-for-approval
          filters:
            branches:
              only:
                - main
                - develop

      - build-arm64-docker:
          context:
            - docker-hub-creds
          requires:
            - hold-for-approval
          filters:
            branches:
              only:
                - main
                - develop

      - create-multiarch-manifest:
          context:
            - docker-hub-creds
          requires:
            - build-amd64-docker
            - build-arm64-docker
          filters:
            branches:
              only:
                - main
                - develop
